<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'SoulCraft'; src: url('../fonts/soulcraftgx.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAFAFA; font-family: 'Barlow', sans-serif; }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 64px;
  }
  .nav-light { background: rgba(250,250,250,0.97); border-bottom: 1px solid rgba(0,0,0,0.08); }
  .nav-dark  { background: rgba(13,13,13,0.97);   border-bottom: 1px solid rgba(255,255,255,0.07); }

  .logo { display: flex; align-items: center; }
  .logo img { height: 32px; object-fit: contain; }

  .nav-links { display: flex; gap: 24px; }
  .link-light { font-size: 12px; font-weight: 600; color: #7A7A7A; text-decoration: none; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 2px solid transparent; padding-bottom: 2px; }
  .link-light.active { color: #155F97; border-bottom-color: #155F97; }
  .link-dark  { font-size: 12px; font-weight: 600; color: #555;   text-decoration: none; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 2px solid transparent; padding-bottom: 2px; }
  .link-dark.active  { color: #fff; border-bottom-color: #1E7ABE; }

  .btn-cta-l { background: #155F97; color: #fff; border: none; padding: 8px 18px; font-family: 'SoulCraft','Barlow Condensed',sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 4px; cursor: pointer; }
  .btn-cta-d { background: #1E7ABE; color: #fff; border: none; padding: 8px 18px; font-family: 'SoulCraft','Barlow Condensed',sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 4px; cursor: pointer; }

  .mode-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 10px 32px 0; }
  .light-label { color: #9A9A9A; }
  .dark-label  { color: #555; }

  .toggle {
    background: #F0F0F0; border: 1px solid #E0E0E0;
    border-radius: 100px; padding: '5px 12px'; font-size: 11px;
    color: #7A7A7A; font-weight: 600; cursor: pointer;
    padding: 5px 12px;
  }
</style>
</head>
<body>

  <div class="mode-label light-label">☀️ Navbar — Light Mode</div>
  <nav class="nav nav-light">
    <div class="logo">
      <img src="../assets/logo-azul-preto.png" alt="ABSOLUT Sport">
    </div>
    <div class="nav-links">
      <a class="link-light active">Eventos</a>
      <a class="link-light">Libertadores</a>
      <a class="link-light">Sudamericana</a>
      <a class="link-light">Sobre Nós</a>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="toggle">🌙 Dark</button>
      <button class="btn-cta-l">Comprar Pacote</button>
    </div>
  </nav>

  <div class="mode-label dark-label" style="background:#0D0D0D; padding-top:14px;">🌙 Navbar — Dark Mode</div>
  <nav class="nav nav-dark">
    <div class="logo">
      <img src="../assets/logo-azul-branco.png" alt="ABSOLUT Sport">
    </div>
    <div class="nav-links">
      <a class="link-dark active">Eventos</a>
      <a class="link-dark">Libertadores</a>
      <a class="link-dark">Sudamericana</a>
      <a class="link-dark">Sobre Nós</a>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button style="background:#1A1A1A;border:1px solid #333;border-radius:100px;padding:5px 12px;font-size:11px;color:#7A7A7A;font-weight:600;cursor:pointer;">☀️ Light</button>
      <button class="btn-cta-d">Comprar Pacote</button>
    </div>
  </nav>

<script src="../zero-to-o.js"></script>
</body>
</html>
