server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ttf|woff|woff2|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /docker-compose.yml { deny all; }
    location = /nginx.conf        { deny all; }
    location = /.gitignore        { deny all; }
    location ~ /\.git             { deny all; }
}
